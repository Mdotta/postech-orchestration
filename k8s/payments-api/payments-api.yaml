apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-config
  namespace: gamestore
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  RabbitMQ__Host: "rabbitmq.infrastructure.svc.cluster.local"
  RabbitMQ__Port: "5672"
  RabbitMQ__VirtualHost: "/"
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secret
  namespace: gamestore
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgresql.infrastructure.svc.cluster.local;Port=5432;Database=postech_payments;Username=postech_admin;Password=postech_dev_password"
  RabbitMQ__Username: "postech_user"
  RabbitMQ__Password: "postech_rabbit_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: gamestore
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: ${DOCKER_USER}/payments-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payments-api-config
            - secretRef:
                name: payments-api-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: gamestore
  labels:
    app: payments-api
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-api-ingress
  namespace: gamestore
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: payments-api.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments-api
                port:
                  number: 80
