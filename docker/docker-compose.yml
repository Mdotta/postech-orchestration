name: postech-dev
services:
  # PostgreSQL - Banco de dados para os microsserviços
  postgres:
    image: postgres:16-alpine
    container_name: postech-postgres
    environment:
      POSTGRES_USER: postech_admin
      POSTGRES_PASSWORD: postech_dev_password
      POSTGRES_DB: postech_main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - postech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postech_admin -d postech_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin - Interface web para gerenciar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: postech-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@postech.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - postech-network
    depends_on:
      - postgres

  # RabbitMQ - Message Broker para comunicação assíncrona
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: postech-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: postech_user
      RABBITMQ_DEFAULT_PASS: postech_rabbit_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    networks:
      - postech-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache
  redis:
    image: redis:7-alpine
    container_name: postech-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - postech-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  rabbitmq_data:
    driver: local
  rabbitmq_log:
    driver: local
  redis_data:
    driver: local

networks:
  postech-network:
    driver: bridge
    name: postech-network