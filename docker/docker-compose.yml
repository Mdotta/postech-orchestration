name: postech-k8s-like

services:
  postgresql:
    image: postgres:16-alpine
    container_name: postech-postgresql
    environment:
      POSTGRES_DB: postech_main
      POSTGRES_USER: postech_admin
      POSTGRES_PASSWORD: postech_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ../docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postech_admin -d postech_main"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      gamestore-net:
        aliases:
          - postgresql.infrastructure.svc.cluster.local

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: postech-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: postech_user
      RABBITMQ_DEFAULT_PASS: postech_rabbit_password
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 15s
      retries: 20
    networks:
      gamestore-net:
        aliases:
          - rabbitmq.infrastructure.svc.cluster.local

  redis:
    image: redis:7-alpine
    container_name: postech-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      gamestore-net:
        aliases:
          - redis.infrastructure.svc.cluster.local

  mongodb:
    image: mongo:7-jammy
    container_name: postech-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: postech_admin
      MONGO_INITDB_ROOT_PASSWORD: postech_dev_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      gamestore-net:
        aliases:
          - mongodb.infrastructure.svc.cluster.local

  users-api:
    image: ${DOCKER_USER:-postech}/users-api:${IMAGE_TAG:-local}
    container_name: postech-users-api
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq.infrastructure.svc.cluster.local
      RabbitMQ__Port: "5672"
      RabbitMQ__VirtualHost: "/"
      JwtSettings__Issuer: PostechAuthServer
      JwtSettings__Audience: PostechUsersAPI
      JwtSettings__ExpirationMinutes: "60"
      Redis__Host: redis.infrastructure.svc.cluster.local
      ConnectionStrings__DefaultConnection: Host=postgresql.infrastructure.svc.cluster.local;Port=5432;Database=postech_users;Username=postech_admin;Password=postech_dev_password
      JwtSettings__SecretKey: MinhaChaveJwtSuperSecreta12345678
      RabbitMQ__Username: postech_user
      RabbitMQ__Password: postech_rabbit_password
    ports:
      - "8081:8080"
    networks:
      - gamestore-net

  catalog-api:
    image: ${DOCKER_USER:-postech}/catalog-api:${IMAGE_TAG:-local}
    container_name: postech-catalog-api
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq.infrastructure.svc.cluster.local
      RabbitMQ__Port: "5672"
      RabbitMQ__VirtualHost: "/"
      ConnectionStrings__DefaultConnection: Host=postgresql.infrastructure.svc.cluster.local;Port=5432;Database=postech_catalog;Username=postech_admin;Password=postech_dev_password
      MongoDB__ConnectionString: mongodb://postech_admin:postech_dev_password@mongodb.infrastructure.svc.cluster.local:27017
      MongoDB__DatabaseName: postech_catalog
      RabbitMQ__Username: postech_user
      RabbitMQ__Password: postech_rabbit_password
    ports:
      - "8082:8080"
    networks:
      - gamestore-net

  payments-api:
    image: ${DOCKER_USER:-postech}/payments-api:${IMAGE_TAG:-local}
    container_name: postech-payments-api
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq.infrastructure.svc.cluster.local
      RabbitMQ__Port: "5672"
      RabbitMQ__VirtualHost: "/"
      ConnectionStrings__DefaultConnection: Host=postgresql.infrastructure.svc.cluster.local;Port=5432;Database=postech_payments;Username=postech_admin;Password=postech_dev_password
      RabbitMQ__Username: postech_user
      RabbitMQ__Password: postech_rabbit_password
    ports:
      - "8083:8080"
    networks:
      - gamestore-net

  notifications-api:
    image: ${DOCKER_USER:-postech}/notifications-api:${IMAGE_TAG:-local}
    container_name: postech-notifications-api
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      RabbitMQ__Host: rabbitmq.infrastructure.svc.cluster.local
      RabbitMQ__Port: "5672"
      RabbitMQ__VirtualHost: "/"
      Brevo__SenderEmail: fiapcloudgamesgrupo25@gmail.com
      Brevo__SenderName: FIAP Cloud Games
      RabbitMQ__Username: postech_user
      RabbitMQ__Password: postech_rabbit_password
      Brevo__ApiKey: ${BREVO_API_KEY:-CHANGE_TO_YOUR_BREVO_API_KEY}
      MongoDB__ConnectionString: mongodb://postech_admin:postech_dev_password@mongodb.infrastructure.svc.cluster.local:27017
      MongoDB__DatabaseName: postech_notifications
    ports:
      - "8084:80"
    networks:
      - gamestore-net

volumes:
  postgresql_data:
  rabbitmq_data:
  redis_data:
  mongodb_data:

networks:
  gamestore-net:
    driver: bridge
